[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-composition"
version = "0.1.0"
description = "Structural validator for declared Loomground compositions: reports whether a named composition resolves stage by stage."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "flxk1" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
loomground-composition = "loomground_composition.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loomground_composition*"]
