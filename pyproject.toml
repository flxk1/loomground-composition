[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-composition"
version = "0.1.0"
description = "Pure, plane-neutral, descriptive validator for Loomground composition well-formedness (structural only; no runner)."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Loomground Contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
loomground-composition = "loomground_composition.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loomground_composition*"]
